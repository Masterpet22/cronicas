<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demo de RPG ninja 2D por turnos con campaña y progresión.">
  <title>Crónicas del Sello · Demo</title>
  <link rel="icon" href="assets/favicon.png?v=0.20.0" type="image/png">
  <link rel="preload" href="assets/fonts/cinzel-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/alegreya-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/village/aldea.webp?v=0.20.0" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css?v=0.20.0">
  <link rel="stylesheet" href="desktop.css?v=0.23.0">
</head>
<body>
  <main>
    <header class="game-heading" aria-label="Controles generales">
      <div class="game-brand">
        <p class="eyebrow">RPG 2D POR TURNOS</p>
        <h1>Crónicas del Sello</h1>
      </div>
      <details class="game-settings">
        <summary><span aria-hidden="true">⚙</span> Ajustes</summary>
        <div class="game-settings-panel">
          <div class="game-options">
            <div class="option-row">
              <label class="mode-switch" for="manual-seals"><input id="manual-seals" type="checkbox" checked><span>Sellos manuales</span></label>
              <label class="mode-switch" for="camera-effects"><input id="camera-effects" type="checkbox" checked><span>Sacudida de cámara</span></label>
              <label class="mode-switch" for="flash-effects"><input id="flash-effects" type="checkbox" checked><span>Destellos de pantalla</span></label>
              <label class="mode-switch" for="music-enabled"><input id="music-enabled" type="checkbox" checked><span>Música</span></label>
              <label class="mode-switch" for="light-mode"><input id="light-mode" type="checkbox"><span>Modo ligero</span></label>
              <label class="volume-control" for="game-volume"><span>Volumen</span><input id="game-volume" type="range" min="0" max="100" value="70"></label>
            </div>
            <p id="mode-hint" class="hint">Completa las secuencias con QWER / ASDF / ZXCV.</p>
          </div>
        </div>
      </details>
    </header>
    <section id="meta" aria-label="Dojo y progreso del personaje"><div class="app-loading" role="status"><span aria-hidden="true"></span><strong>Abriendo las crónicas…</strong></div></section>
    <section id="game" aria-label="Juego de combate por turnos" hidden></section>
    <noscript>Este prototipo necesita JavaScript activado.</noscript>
  </main>
  <script defer src="assets/vendor/phaser-3.90.0.min.js"></script>
  <script type="module" src="game.js?v=0.43.3"></script>
</body>
</html>
