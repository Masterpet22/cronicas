<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo de combate ninja 2D por turnos.">
  <title>Crónicas del Sello · Prototipo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="game-heading">
      <div>
        <p class="eyebrow">PROTOTIPO DE COMBATE</p>
        <h1>Crónicas del Sello</h1>
      </div>
      <div class="game-options">
        <div class="option-row">
          <label class="mode-switch" for="manual-seals"><input id="manual-seals" type="checkbox" checked><span>Sellos manuales</span></label>
          <label class="mode-switch" for="camera-effects"><input id="camera-effects" type="checkbox" checked><span>Cámara</span></label>
          <label class="mode-switch" for="flash-effects"><input id="flash-effects" type="checkbox" checked><span>Destellos</span></label>
          <label class="volume-control" for="game-volume"><span>Volumen</span><input id="game-volume" type="range" min="0" max="100" value="70"></label>
        </div>
        <p id="mode-hint" class="hint">Completa las secuencias con QWER / ASDF / ZXCV.</p>
      </div>
    </header>
    <section id="game" aria-label="Juego de combate por turnos"></section>
    <noscript>Este prototipo necesita JavaScript activado.</noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
