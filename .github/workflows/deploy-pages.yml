name: Publicar juego en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        run: node scripts/stage-pages.mjs "$RUNNER_TEMP/cronicas-pages"
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cronicas-pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
